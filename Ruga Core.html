<style>
/* Layout: brand hero band, sticky category nav, two-column card grids per system group, spec table at the end. */
:root {
  color-scheme: dark;
  --bg: #0c0607;
  --bg-2: #140a0b;
  --panel: #1a0f10;
  --line: #3a2224;
  --fg: #f3eeee;
  --mute: #b39c9e;
  --red: #e50004;
  --red-l: #ff3b3e;
  --red-soft: rgba(229, 0, 4, .16);
  --ok: #4fd13a;
  --f-display: 'Inter', 'Segoe UI', Arial, sans-serif;
  --f-body: 'Inter', 'Segoe UI', Arial, sans-serif;
  --f-mono: 'JetBrains Mono', Consolas, monospace;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
a { color: var(--red-l); }
.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
:focus-visible { outline: 2px solid var(--red-l); outline-offset: 2px; }

/* Hero */
.hero { position: relative; overflow: hidden; margin-top: calc(-1 * env(safe-area-inset-top, 0px)); padding-top: calc(env(safe-area-inset-top, 0px) + 56px); padding-bottom: 56px;
  background:
    radial-gradient(60% 80% at 8% 10%, rgba(229,0,4,.38) 0%, rgba(229,0,4,0) 70%),
    radial-gradient(50% 60% at 95% 100%, rgba(229,0,4,.18) 0%, rgba(229,0,4,0) 70%),
    linear-gradient(180deg, #1c0708 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--line); }
.hero-top { display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { font-family: var(--f-display); font-weight: 900; font-style: italic; font-size: 22px; letter-spacing: -.3px; }
.brand span { color: var(--red); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: rgba(0,0,0,.3); }
.lang button { appearance: none; border: 0; background: transparent; color: var(--mute); font: 700 12.5px var(--f-body); padding: 6px 14px; border-radius: 999px; cursor: pointer; letter-spacing: .4px; }
.lang button[aria-pressed="true"] { background: var(--fg); color: #140a0b; }
.hero h1 { margin: 40px 0 0; font-family: var(--f-display); font-weight: 900; font-style: italic; font-size: clamp(40px, 7vw, 76px); line-height: .95; letter-spacing: -2px; text-wrap: balance; }
.hero h1 em { color: var(--red); font-style: italic; }
.hero .lead { margin: 18px 0 0; max-width: 64ch; font-size: 18px; color: #e1d5d6; }
.tag { display: inline-flex; align-items: center; height: 24px; padding: 0 10px; border-radius: 3px; background: var(--red); font-size: 11.5px; font-weight: 800; letter-spacing: .6px; text-transform: uppercase; box-shadow: 0 0 16px rgba(229,0,4,.45); }
.stats { margin-top: 34px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.stat { padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; background: rgba(0,0,0,.28); }
.stat b { display: block; font-family: var(--f-display); font-weight: 900; font-style: italic; font-size: 30px; color: var(--red-l); font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat span { font-size: 12.5px; color: var(--mute); }

/* Nav */
nav.cats { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: rgba(12,6,7,.94); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
nav.cats .wrap { display: flex; gap: 6px; overflow-x: auto; padding-block: 10px; scrollbar-width: none; }
nav.cats a { flex: none; text-decoration: none; color: var(--mute); font-size: 13px; font-weight: 700; padding: 7px 12px; border-radius: 3px; border: 1px solid transparent; }
nav.cats a:hover { color: var(--fg); border-color: var(--line); }

/* Sections */
main { padding-block: 24px 56px; }
section.group { padding-top: 40px; scroll-margin-top: 70px; }
.ghead { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; border-bottom: 1px solid var(--line); padding-bottom: 12px; }
.ghead h2 { margin: 0; font-family: var(--f-display); font-weight: 900; font-style: italic; font-size: 30px; letter-spacing: -.5px; text-wrap: balance; }
.ghead h2::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--red-l); box-shadow: 0 0 8px rgba(229,0,4,.8); margin-right: 12px; vertical-align: 6px; }
.ghead p { margin: 0; color: var(--mute); max-width: 70ch; }
.grid { margin-top: 18px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.card { min-width: 0; padding: 16px 18px; border: 1px solid var(--line); border-radius: 4px; background: var(--panel); }
.card h3 { margin: 0; font-size: 16px; font-weight: 800; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.card h3 code { font-family: var(--f-mono); font-size: 11.5px; font-weight: 500; color: var(--mute); background: rgba(255,255,255,.04); padding: 1px 6px; border-radius: 3px; }
.card p { margin: 8px 0 0; color: #dccfd0; font-size: 14px; }
.card ul { margin: 8px 0 0; padding-left: 18px; color: #dccfd0; font-size: 14px; }
.card li + li { margin-top: 3px; }
.card.feature { grid-column: 1 / -1; border-color: rgba(229,0,4,.45); background: linear-gradient(135deg, rgba(229,0,4,.10), rgba(229,0,4,0) 55%), var(--panel); }
.chips { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 11px; font-weight: 700; color: var(--mute); border: 1px solid var(--line); border-radius: 3px; padding: 1px 7px; }

/* Specs */
.specs { margin-top: 18px; overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; min-width: 560px; }
th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 11.5px; letter-spacing: .6px; text-transform: uppercase; color: var(--mute); background: var(--bg-2); }
tr:last-child td { border-bottom: 0; }
td code { font-family: var(--f-mono); font-size: 12.5px; }
.req { color: var(--red-l); font-weight: 700; }
.opt { color: var(--mute); font-weight: 700; }
.notes { margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
footer { border-top: 1px solid var(--line); padding-block: 26px; color: var(--mute); font-size: 13px; }

@media (max-width: 860px) {
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid, .notes { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: no-preference) {
  .card { transition: border-color .15s; }
  .card:hover { border-color: rgba(229,0,4,.45); }
}
</style>

  function render() {
    var t = T[lang];

    document.querySelectorAll('[data-i18n]').forEach(function (el) { el.textContent = t[el.getAttribute('data-i18n')] || ''; });
